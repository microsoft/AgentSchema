$schema: https://json-schema.org/draft/2020-12/schema
$id: Policy.yaml
type: object
properties:
  type:
    type: string
    const: rai_policy
    description: The policy type. 'rai_policy' attaches a Responsible AI (content safety) guardrail.
  raiPolicyName:
    type: string
    description: For 'rai_policy', the full ARM resource ID of the Responsible AI policy on the Cognitive Services account (e.g., '/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.CognitiveServices/accounts/<account>/raiPolicies/<policyName>').
required:
  - type
description: |-
  A single safety or governance policy attached to an agent.
  The `type` field discriminates the policy kind; the remaining fields are
  interpreted based on `type`. For `rai_policy`, `raiPolicyName` associates the
  agent with a Responsible AI policy that governs content filtering and safety
  guardrails for prompts and completions.
