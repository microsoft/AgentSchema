$schema: https://json-schema.org/draft/2020-12/schema
$id: RaiConfig.yaml
type: object
properties:
  raiPolicyName:
    type: string
    description: Full ARM resource ID of the Responsible AI policy on the Cognitive Services account (e.g., '/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.CognitiveServices/accounts/<account>/raiPolicies/<policyName>').
required:
  - raiPolicyName
description: |-
  Responsible AI (content safety) configuration applied to an agent.
  Associates the agent with a Responsible AI policy that governs content
  filtering and safety guardrails for prompts and completions.
