name: Publish Docs to GitHub Pages

on:
  # Trigger on docs version tags
  push:
    tags:
      - "docs-v*"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set site URL based on repository
        run: |
          SITE_URL="https://${{ github.repository_owner }}.github.io"
          sed -i "s|site: .*|site: \"${SITE_URL}\",|" docs/astro.config.mjs
          echo "Set site URL to: $SITE_URL"

      - name: Install, build, and upload your site
        uses: withastro/action@a4407e937037e68022f04ae1c068d3634f08bc8d # v4.2.1
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
